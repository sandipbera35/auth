spring.application.name=auth

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${DB_USERNAME:vectorda}
spring.datasource.password=${DB_PASSWORD:vectorda}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true

jwt.issuer=${JWT_ISSUER:auth-server}
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:classpath:certs/private_key.pem}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public_key.pem}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}

spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public_key.pem}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:auth}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
